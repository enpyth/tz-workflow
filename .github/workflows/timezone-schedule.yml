name: Timezone schedule test

on:
  schedule:
    - cron: '30 11 * * *'
      timezone: Australia/Adelaide
    - cron: '35 11 * * *'
      timezone: Australia/Adelaide
    - cron: '40 11 * * *'
      timezone: Australia/Adelaide
  workflow_dispatch:
    inputs:
      city:
        description: City to print for a manual test
        required: true
        type: choice
        options:
          - sydney
          - tokyo
          - new_york

permissions: {}

jobs:
  print-time:
    runs-on: ubuntu-latest
    steps:
      - name: Sydney time (11:30 Adelaide)
        if: github.event.schedule == '30 11 * * *' || inputs.city == 'sydney'
        run: |
          echo "Scheduled: 11:30 Australia/Adelaide"
          echo "Actual Adelaide time: $(TZ=Australia/Adelaide date '+%Y-%m-%d %H:%M:%S %Z %z')"
          echo "Sydney time: $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M:%S %Z %z')"

      - name: Tokyo time (11:35 Adelaide)
        if: github.event.schedule == '35 11 * * *' || inputs.city == 'tokyo'
        run: |
          echo "Scheduled: 11:35 Australia/Adelaide"
          echo "Actual Adelaide time: $(TZ=Australia/Adelaide date '+%Y-%m-%d %H:%M:%S %Z %z')"
          echo "Tokyo time: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %Z %z')"

      - name: New York time (11:40 Adelaide)
        if: github.event.schedule == '40 11 * * *' || inputs.city == 'new_york'
        run: |
          echo "Scheduled: 11:40 Australia/Adelaide"
          echo "Actual Adelaide time: $(TZ=Australia/Adelaide date '+%Y-%m-%d %H:%M:%S %Z %z')"
          echo "New York time: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z %z')"
